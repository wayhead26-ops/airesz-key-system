<body>
  <main class="linkvertise-bridge shell">
    <article class="builder-card bridge-card">
      <div class="mini-brand"><img src="assets/airesz-mark.png" alt=""><div><strong>AIRESZ</strong><span>LINKVERTISE CHECKPOINT</span></div></div>
      <h1>Continue through Linkvertise</h1>
      <p>Click the button below. After completing the task, you will return to the key system automatically.</p>
      <a id="continueLink" class="primary-button" rel="nofollow">Continue Checkpoint</a>
      <p id="bridgeMessage" class="message"></p>
    </article>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get("target");
    const link = document.getElementById("continueLink");
    const message = document.getElementById("bridgeMessage");
    try {
      const url = new URL(target);
      if (url.protocol !== "https:" || !url.pathname.includes("/api/provider/linkvertise/callback")) throw new Error();
      link.href = url.toString();
    } catch {
      link.removeAttribute("href");
      link.setAttribute("aria-disabled", "true");
      message.textContent = "Invalid checkpoint target.";
    }
  </script>
</body>
