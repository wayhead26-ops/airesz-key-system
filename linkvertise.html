<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Airesz · Linkvertise Checkpoint</title>
  <link rel="stylesheet" href="styles.css?v=3.5.4">

</head>
<body>
  <main class="linkvertise-bridge shell">
    <article class="builder-card bridge-card">
      <div class="mini-brand"><img src="assets/airesz-mark.png" alt=""><div><strong>AIRESZ</strong><span>LINKVERTISE CHECKPOINT</span></div></div>
      <h1>Continue through Linkvertise</h1>
      <p>Click the button below. After completing the task, you will return to the key system automatically.</p>
      <a id="continueLink" class="primary-button">Continue Checkpoint</a>
      <p id="bridgeMessage" class="message"></p>
    </article>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get("target");
    const link = document.getElementById("continueLink");
    const message = document.getElementById("bridgeMessage");
    try {
      const url = new URL(target);
      if (url.protocol !== "https:" || !url.pathname.includes("/api/provider/linkvertise/callback")) throw new Error();
      link.href = url.toString();
    } catch {
      link.removeAttribute("href");
      link.setAttribute("aria-disabled", "true");
      message.textContent = "Invalid checkpoint target.";
    }
  </script>

  <!--
    The checkpoint href is created dynamically above. Load and initialize
    Full Script only after that href exists so Linkvertise can convert it.
  -->
  <!-- LINKVERTISE FULL SCRIPT START -->
  <script src="https://publisher.linkvertise.com/cdn/linkvertise.js"></script>
  <script>
    if (link.hasAttribute("href")) {
      if (typeof window.linkvertise === "function") {
        try {
          window.linkvertise(464933, { whitelist: [], blacklist: [] });
        } catch {
          link.removeAttribute("href");
          link.setAttribute("aria-disabled", "true");
          message.textContent = "Linkvertise could not initialize. Disable your ad blocker and reload this page.";
        }
      } else {
        link.removeAttribute("href");
        link.setAttribute("aria-disabled", "true");
        message.textContent = "Linkvertise was blocked. Disable your ad blocker and reload this page.";
      }
    }
  </script>
  <!-- LINKVERTISE FULL SCRIPT END -->
</body>
</html>
